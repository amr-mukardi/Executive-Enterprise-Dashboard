<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">ApexVision - Executive Business Presentation Q4 2025 (dark cover)</title>
  <desc id="d">Cover artwork with a dashboard preview: KPI tiles, quarterly revenue line chart, category donut and department performance bars.</desc>
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4d8cf5"/><stop offset="1" stop-color="#6c5ce7"/></linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4d8cf5" stop-opacity=".45"/><stop offset="1" stop-color="#4d8cf5" stop-opacity="0"/></linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1a2234" stop-opacity=".92"/><stop offset="1" stop-color="#0f1520" stop-opacity=".92"/></linearGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse"><path d="M60 0H0V60" fill="none" stroke="#ffffff" stroke-opacity=".04"/></pattern>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="90"/></filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000000" flood-opacity=".55"/></filter>
    <clipPath id="clipLine"><rect x="28" y="215" width="380" height="250" rx="18"/></clipPath>
  </defs>

  <rect width="1600" height="900" fill="#080c14"/>
  <circle cx="1400" cy="90" r="320" fill="#4d8cf5" opacity=".38" filter="url(#blur)"/>
  <circle cx="140" cy="860" r="300" fill="#a855f7" opacity=".26" filter="url(#blur)"/>
  <circle cx="900" cy="460" r="220" fill="#06b6d4" opacity=".14" filter="url(#blur)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>

  <g font-family="Inter, 'Segoe UI', Arial, sans-serif">
    <rect x="110" y="150" width="72" height="72" rx="18" fill="url(#accent)"/>
    <text x="146" y="200" font-size="42" font-weight="700" fill="#fff" text-anchor="middle">A</text>
    <text x="202" y="180" font-size="30" font-weight="700" fill="#e8ecf2">ApexVision</text>
    <text x="202" y="210" font-size="17" fill="#9aa4b8">Q4 2025 Briefing</text>

    <g font-size="86" font-weight="800" fill="#e8ecf2" letter-spacing="-2">
      <text x="106" y="410">Executive</text>
      <text x="106" y="496">Business</text>
      <text x="106" y="582">Presentation</text>
    </g>
    <rect x="110" y="624" width="140" height="7" rx="3.5" fill="url(#accent)"/>
    <text x="110" y="688" font-size="23" fill="#9aa4b8">Revenue, sales, customers, operations and finance</text>

    <rect x="110" y="730" width="150" height="46" rx="23" fill="#10b981" fill-opacity=".14" stroke="#10b981" stroke-opacity=".4"/>
    <text x="185" y="760" font-size="19" font-weight="600" fill="#10b981" text-anchor="middle">&#9679; Q4 2025</text>
  </g>

  <g transform="translate(860 130)" font-family="Inter, 'Segoe UI', Arial, sans-serif">
    <rect width="640" height="640" rx="28" fill="url(#card)" stroke="#ffffff" stroke-opacity=".12" filter="url(#shadow)"/>
    <circle cx="36" cy="36" r="6" fill="#ef4444"/><circle cx="58" cy="36" r="6" fill="#f59e0b"/><circle cx="80" cy="36" r="6" fill="#10b981"/>

    <g font-size="14" fill="#9aa4b8">
      <rect x="28" y="70" width="190" height="124" rx="18" fill="#ffffff" fill-opacity=".05" stroke="#ffffff" stroke-opacity=".08"/>
      <text x="48" y="100">Total revenue</text>
      <text x="48" y="144" font-size="36" font-weight="800" fill="#e8ecf2" font-family="'JetBrains Mono', Consolas, monospace">$284.7M</text>
      <text x="48" y="174" font-weight="600" fill="#10b981">&#9650; +18.3% YoY</text>

      <rect x="225" y="70" width="190" height="124" rx="18" fill="#ffffff" fill-opacity=".05" stroke="#ffffff" stroke-opacity=".08"/>
      <text x="245" y="100">Active customers</text>
      <text x="245" y="144" font-size="36" font-weight="800" fill="#e8ecf2" font-family="'JetBrains Mono', Consolas, monospace">14,283</text>
      <text x="245" y="174" font-weight="600" fill="#10b981">&#9650; +12.7% YoY</text>

      <rect x="422" y="70" width="190" height="124" rx="18" fill="#ffffff" fill-opacity=".05" stroke="#ffffff" stroke-opacity=".08"/>
      <text x="442" y="100">SLA compliance</text>
      <text x="442" y="144" font-size="36" font-weight="800" fill="#e8ecf2" font-family="'JetBrains Mono', Consolas, monospace">94.2%</text>
      <text x="442" y="174" font-weight="600" fill="#10b981">&#9650; +2.1pp</text>
    </g>

    <rect x="28" y="215" width="380" height="250" rx="18" fill="#ffffff" fill-opacity=".05" stroke="#ffffff" stroke-opacity=".08"/>
    <text x="48" y="245" font-size="14" font-weight="600" fill="#9aa4b8">Quarterly revenue</text>
    <g clip-path="url(#clipLine)">
      <path d="M48 300H388M48 350H388M48 400H388" stroke="#ffffff" stroke-opacity=".07"/>
      <path d="M60 395 L165 362 L270 341 L376 308 V440 H60 Z" fill="url(#area)"/>
      <path d="M60 401 L165 372 L270 349 L376 326" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="7 6" stroke-linecap="round"/>
      <path d="M60 395 L165 362 L270 341 L376 308" fill="none" stroke="#4d8cf5" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <g fill="#4d8cf5" stroke="#0f1520" stroke-width="3">
        <circle cx="60" cy="395" r="6"/><circle cx="165" cy="362" r="6"/><circle cx="270" cy="341" r="6"/><circle cx="376" cy="308" r="6"/>
      </g>
    </g>
    <g font-size="12" fill="#5f6b7c" text-anchor="middle">
      <text x="60" y="457">Q1</text><text x="165" y="457">Q2</text><text x="270" y="457">Q3</text><text x="376" y="457">Q4</text>
    </g>

    <rect x="428" y="215" width="184" height="250" rx="18" fill="#ffffff" fill-opacity=".05" stroke="#ffffff" stroke-opacity=".08"/>
    <text x="448" y="245" font-size="14" font-weight="600" fill="#9aa4b8">Category mix</text>
    <g transform="rotate(-90 520 350)" fill="none" stroke-width="20">
      <circle cx="520" cy="350" r="52" stroke="#4d8cf5" stroke-dasharray="134.2 192.5" stroke-dashoffset="0"/>
      <circle cx="520" cy="350" r="52" stroke="#10b981" stroke-dasharray="88.5 238.2" stroke-dashoffset="-137.2"/>
      <circle cx="520" cy="350" r="52" stroke="#f59e0b" stroke-dasharray="46 280.7" stroke-dashoffset="-228.7"/>
      <circle cx="520" cy="350" r="52" stroke="#a855f7" stroke-dasharray="29.7 297" stroke-dashoffset="-277.7"/>
      <circle cx="520" cy="350" r="52" stroke="#06b6d4" stroke-dasharray="13.3 313.4" stroke-dashoffset="-310.4"/>
    </g>
    <text x="520" y="358" font-size="22" font-weight="800" fill="#e8ecf2" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace">42%</text>
    <g font-size="12" fill="#9aa4b8">
      <circle cx="450" cy="435" r="4" fill="#4d8cf5"/><text x="460" y="439">Software</text>
      <circle cx="530" cy="435" r="4" fill="#10b981"/><text x="540" y="439">Cloud</text>
    </g>

    <rect x="28" y="485" width="584" height="127" rx="18" fill="#ffffff" fill-opacity=".05" stroke="#ffffff" stroke-opacity=".08"/>
    <text x="48" y="512" font-size="14" font-weight="600" fill="#9aa4b8">Department performance</text>
    <path d="M48 596H592" stroke="#ffffff" stroke-opacity=".1"/>
    <rect x="62" y="525.5" width="56" height="70.5" rx="8" fill="#4d8cf5"/>
    <rect x="154" y="530" width="56" height="66" rx="8" fill="#10b981"/>
    <rect x="246" y="528" width="56" height="68" rx="8" fill="#4d8cf5"/>
    <rect x="338" y="532" width="56" height="64" rx="8" fill="#f59e0b"/>
    <rect x="430" y="528.5" width="56" height="67.5" rx="8" fill="#10b981"/>
    <rect x="522" y="534.5" width="56" height="61.5" rx="8" fill="#f59e0b"/>
  </g>

  <g font-family="Inter, 'Segoe UI', Arial, sans-serif" filter="url(#shadow)">
    <rect x="1320" y="86" width="214" height="76" rx="20" fill="#121826" stroke="#10b981" stroke-opacity=".45"/>
    <text x="1344" y="116" font-size="14" fill="#9aa4b8">Net profit</text>
    <text x="1344" y="148" font-size="30" font-weight="800" fill="#e8ecf2" font-family="'JetBrains Mono', Consolas, monospace">$67.8M</text>
    <text x="1514" y="148" font-size="14" font-weight="700" fill="#10b981" text-anchor="end">&#9650; 22.4%</text>

    <rect x="790" y="690" width="236" height="76" rx="20" fill="#121826" stroke="#4d8cf5" stroke-opacity=".45"/>
    <text x="814" y="720" font-size="14" fill="#9aa4b8">Retention rate</text>
    <text x="814" y="752" font-size="30" font-weight="800" fill="#e8ecf2" font-family="'JetBrains Mono', Consolas, monospace">94.8%</text>
    <text x="1004" y="752" font-size="14" font-weight="700" fill="#10b981" text-anchor="end">&#9650; 3.2pp</text>
  </g>
</svg>
