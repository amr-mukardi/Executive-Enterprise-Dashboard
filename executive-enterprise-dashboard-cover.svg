<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" fill="none">
    <defs>
        <!-- Premium Background Gradients -->
        <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#080c14"/>
            <stop offset="45%" stop-color="#0e1320"/>
            <stop offset="100%" stop-color="#0a0f1a"/>
        </linearGradient>
        <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#4d8cf5"/>
            <stop offset="100%" stop-color="#6c5ce7"/>
        </linearGradient>
        <linearGradient id="greenGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#10b981"/>
            <stop offset="100%" stop-color="#059669"/>
        </linearGradient>
        
        <!-- Glass Card Materials -->
        <linearGradient id="glassBg" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="rgba(16,20,30,0.85)"/>
            <stop offset="100%" stop-color="rgba(16,20,30,0.45)"/>
        </linearGradient>
        <linearGradient id="glassBorder" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="rgba(255,255,255,0.12)"/>
            <stop offset="50%" stop-color="rgba(255,255,255,0.03)"/>
            <stop offset="100%" stop-color="rgba(255,255,255,0.08)"/>
        </linearGradient>
        
        <!-- Glow Filters -->
        <filter id="glowAccent" x="-30%" y="-30%" width="160%" height="160%">
            <feGaussianBlur in="SourceGraphic" stdDeviation="10" result="blur"/>
            <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.302  0 0 0 0 0.549  0 0 0 0 0.961  0 0 0 0.45 0" result="glow"/>
            <feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <filter id="glowGreen" x="-30%" y="-30%" width="160%" height="160%">
            <feGaussianBlur in="SourceGraphic" stdDeviation="7" result="blur2"/>
            <feColorMatrix in="blur2" type="matrix" values="0 0 0 0 0.063  0 0 0 0 0.725  0 0 0 0 0.506  0 0 0 0.35 0" result="glow2"/>
            <feMerge><feMergeNode in="glow2"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <filter id="glowPurple" x="-30%" y="-30%" width="160%" height="160%">
            <feGaussianBlur in="SourceGraphic" stdDeviation="14" result="blur3"/>
            <feColorMatrix in="blur3" type="matrix" values="0 0 0 0 0.659  0 0 0 0 0.333  0 0 0 0 0.969  0 0 0 0.25 0" result="glow3"/>
            <feMerge><feMergeNode in="glow3"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        
        <!-- Depth Shadows -->
        <filter id="cardShadow" x="-5%" y="-5%" width="120%" height="120%">
            <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.35"/>
            <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.2"/>
        </filter>
        <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
            <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#000000" flood-opacity="0.25"/>
        </filter>

        <!-- Ambient Orbs -->
        <radialGradient id="orbBlue" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#4d8cf5" stop-opacity="0.2"/>
            <stop offset="100%" stop-color="#4d8cf5" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="orbPurple" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#a855f7" stop-opacity="0.1"/>
            <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="orbTeal" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.08"/>
            <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
        </radialGradient>
        
        <!-- Grid Pattern -->
        <pattern id="dotGrid" x="0" y="0" width="36" height="36" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.7" fill="rgba(255,255,255,0.025)"/>
        </pattern>
        
        <!-- Dashboard Chart Line -->
        <linearGradient id="chartLineGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#4d8cf5" stop-opacity="0.3"/>
            <stop offset="100%" stop-color="#4d8cf5" stop-opacity="0"/>
        </linearGradient>
    </defs>

    <!-- ===== BACKGROUND ===== -->
    <rect width="1200" height="630" fill="url(#bgGradient)"/>
    <rect width="1200" height="630" fill="url(#dotGrid)"/>
    
    <!-- Ambient Orbs (Depth & Atmosphere) -->
    <circle cx="1020" cy="80" r="320" fill="url(#orbBlue)"/>
    <circle cx="180" cy="520" r="280" fill="url(#orbPurple)"/>
    <circle cx="600" cy="350" r="220" fill="url(#orbTeal)"/>

    <!-- Outer Border -->
    <rect x="1" y="1" width="1198" height="628" rx="22" stroke="rgba(255,255,255,0.06)" stroke-width="2" fill="none"/>

    <!-- ===== TOP-LEFT BRAND ===== -->
    <g transform="translate(55, 50)">
        <rect x="0" y="0" width="36" height="36" rx="9" fill="url(#accentGradient)" filter="url(#glowAccent)"/>
        <text x="18" y="24" font-family="'Inter','Segoe UI',sans-serif" font-weight="800" font-size="17" fill="#ffffff" text-anchor="middle">A</text>
        <text x="48" y="21" font-family="'Inter','Segoe UI',sans-serif" font-weight="700" font-size="16" fill="#e8ecf2" letter-spacing="-0.8">ApexVision</text>
        <text x="48" y="36" font-family="'Inter','Segoe UI',sans-serif" font-weight="500" font-size="9" fill="#5f6b7c" letter-spacing="2.2">Q4 2025 BRIEFING</text>
    </g>

    <!-- LIVE DATA BADGE -->
    <g transform="translate(55, 115)">
        <rect x="0" y="0" width="108" height="24" rx="12" fill="rgba(16,185,129,0.12)" stroke="rgba(16,185,129,0.28)" stroke-width="1"/>
        <circle cx="18" cy="12" r="3.5" fill="#10b981" filter="url(#glowGreen)"/>
        <text x="34" y="16" font-family="'Inter','Segoe UI',sans-serif" font-weight="600" font-size="10" fill="#10b981" letter-spacing="0.6">LIVE DATA</text>
    </g>

    <!-- ===== MAIN CONTENT (LEFT SIDE) ===== -->
    <!-- English Title -->
    <text x="55" y="215" font-family="'Inter','Segoe UI',sans-serif" font-weight="800" font-size="56" fill="#e8ecf2" letter-spacing="-2.5">Executive Business</text>
    <text x="55" y="280" font-family="'Inter','Segoe UI',sans-serif" font-weight="800" font-size="56" fill="url(#accentGradient)" letter-spacing="-2.5" filter="url(#glowAccent)">Presentation</text>

    <!-- English Subtitle -->
    <text x="55" y="340" font-family="'Inter','Segoe UI',sans-serif" font-weight="400" font-size="16" fill="#9aa4b8" letter-spacing="-0.2">
        Interactive enterprise dashboard combining real‑time analytics,
    </text>
    <text x="55" y="365" font-family="'Inter','Segoe UI',sans-serif" font-weight="400" font-size="16" fill="#9aa4b8" letter-spacing="-0.2">
        strategic storytelling, and premium design for executive decisions.
    </text>

    <!-- Arabic Tagline (Prominent & Elegant) -->
    <text x="55" y="415" font-family="'Noto Sans Arabic','Segoe UI','Tahoma',sans-serif" font-weight="600" font-size="18" fill="#e8ecf2" opacity="0.85" letter-spacing="0.3">
        تحليلات تنفيذية تفاعلية — بيانات حية، رؤى فورية، قرارات ذكية
    </text>

    <!-- Technology Pills -->
    <g transform="translate(55, 455)">
        <rect x="0" y="0" width="94" height="26" rx="7" fill="rgba(77,140,245,0.12)" stroke="rgba(77,140,245,0.25)" stroke-width="1"/>
        <text x="47" y="18" font-family="'Inter','Segoe UI',sans-serif" font-weight="600" font-size="10" fill="#4d8cf5" text-anchor="middle">HTML5</text>

        <rect x="104" y="0" width="94" height="26" rx="7" fill="rgba(16,185,129,0.12)" stroke="rgba(16,185,129,0.25)" stroke-width="1"/>
        <text x="151" y="18" font-family="'Inter','Segoe UI',sans-serif" font-weight="600" font-size="10" fill="#10b981" text-anchor="middle">CSS3</text>

        <rect x="208" y="0" width="94" height="26" rx="7" fill="rgba(245,158,11,0.12)" stroke="rgba(245,158,11,0.25)" stroke-width="1"/>
        <text x="255" y="18" font-family="'Inter','Segoe UI',sans-serif" font-weight="600" font-size="10" fill="#f59e0b" text-anchor="middle">JavaScript</text>

        <rect x="312" y="0" width="94" height="26" rx="7" fill="rgba(6,182,212,0.12)" stroke="rgba(6,182,212,0.25)" stroke-width="1"/>
        <text x="359" y="18" font-family="'Inter','Segoe UI',sans-serif" font-weight="600" font-size="10" fill="#06b6d4" text-anchor="middle">Chart.js</text>

        <rect x="416" y="0" width="94" height="26" rx="7" fill="rgba(168,85,247,0.12)" stroke="rgba(168,85,247,0.25)" stroke-width="1"/>
        <text x="463" y="18" font-family="'Inter','Segoe UI',sans-serif" font-weight="600" font-size="10" fill="#a855f7" text-anchor="middle">RTL Ready</text>
    </g>

    <!-- ===== RIGHT SIDE: PREMIUM DASHBOARD SNIPPET ===== -->
    <g transform="translate(930, 140)">
        <!-- Main Card -->
        <rect x="0" y="0" width="230" height="360" rx="24" fill="url(#glassBg)" stroke="url(#glassBorder)" stroke-width="1.2" filter="url(#cardShadow)"/>
        
        <!-- Inner Card Glow -->
        <rect x="1" y="1" width="228" height="358" rx="23" stroke="rgba(255,255,255,0.03)" stroke-width="1" fill="none"/>

        <!-- KPI Top -->
        <text x="20" y="38" font-family="'JetBrains Mono','Fira Code',monospace" font-weight="800" font-size="28" fill="#e8ecf2">$284.7M</text>
        <text x="20" y="58" font-family="'Inter','Segoe UI',sans-serif" font-weight="500" font-size="10" fill="#5f6b7c" letter-spacing="1.5">TOTAL REVENUE</text>
        
        <!-- Revenue Chart (Line) -->
        <path d="M 20 170 L 46 155 L 72 148 L 98 118 L 124 120 L 150 100 L 176 82 L 202 70" stroke="#4d8cf5" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#glowAccent)"/>
        <path d="M 20 170 L 46 155 L 72 148 L 98 118 L 124 120 L 150 100 L 176 82 L 202 70 L 202 180 L 20 180 Z" fill="url(#chartLineGrad)" opacity="0.6"/>
        
        <!-- Chart Labels -->
        <text x="20" y="195" font-family="'Inter','Segoe UI',sans-serif" font-weight="500" font-size="8" fill="#5f6b7c">JAN</text>
        <text x="72" y="195" font-family="'Inter','Segoe UI',sans-serif" font-weight="500" font-size="8" fill="#5f6b7c">MAR</text>
        <text x="124" y="195" font-family="'Inter','Segoe UI',sans-serif" font-weight="500" font-size="8" fill="#5f6b7c">MAY</text>
        <text x="176" y="195" font-family="'Inter','Segoe UI',sans-serif" font-weight="500" font-size="8" fill="#5f6b7c">JUL</text>
        <text x="202" y="195" font-family="'Inter','Segoe UI',sans-serif" font-weight="600" font-size="8" fill="#10b981">SEP</text>

        <!-- Divider -->
        <line x1="20" y1="215" x2="210" y2="215" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

        <!-- Secondary KPIs -->
        <text x="20" y="245" font-family="'Inter','Segoe UI',sans-serif" font-weight="600" font-size="10" fill="#9aa4b8">SLA COMPLIANCE</text>
        <rect x="20" y="258" width="190" height="6" rx="3" fill="rgba(255,255,255,0.06)"/>
        <rect x="20" y="258" width="178" height="6" rx="3" fill="#10b981" filter="url(#glowGreen)"/>
        <text x="210" y="255" font-family="'JetBrains Mono','Fira Code',monospace" font-weight="700" font-size="12" fill="#10b981" text-anchor="end">94.2%</text>

        <text x="20" y="295" font-family="'Inter','Segoe UI',sans-serif" font-weight="600" font-size="10" fill="#9aa4b8">RETENTION RATE</text>
        <rect x="20" y="308" width="190" height="6" rx="3" fill="rgba(255,255,255,0.06)"/>
        <rect x="20" y="308" width="180" height="6" rx="3" fill="#4d8cf5"/>
        <text x="210" y="305" font-family="'JetBrains Mono','Fira Code',monospace" font-weight="700" font-size="12" fill="#4d8cf5" text-anchor="end">94.8%</text>

        <!-- Mini Bar Comparison -->
        <g transform="translate(20, 335)">
            <rect x="0" y="10" width="14" height="8" rx="3" fill="#4d8cf5" opacity="0.8"/>
            <rect x="20" y="5" width="14" height="13" rx="3" fill="#4d8cf5" opacity="0.6"/>
            <rect x="40" y="0" width="14" height="18" rx="3" fill="#10b981" opacity="0.8" filter="url(#glowGreen)"/>
            <text x="0" y="28" font-family="'Inter','Segoe UI',sans-serif" font-weight="500" font-size="7" fill="#5f6b7c">Q1</text>
            <text x="20" y="28" font-family="'Inter','Segoe UI',sans-serif" font-weight="500" font-size="7" fill="#5f6b7c">Q2</text>
            <text x="40" y="28" font-family="'Inter','Segoe UI',sans-serif" font-weight="600" font-size="7" fill="#10b981">Q3</text>
        </g>
    </g>

    <!-- ===== FOOTER (Subtle) ===== -->
    <text x="55" y="605" font-family="'Inter','Segoe UI',sans-serif" font-weight="400" font-size="10" fill="#4a5568" letter-spacing="0.6">
        Interactive Executive Briefing · Data‑Driven Insights · Enterprise Product Design · Single HTML · RTL Support
    </text>
    <text x="1145" y="605" font-family="'Inter','Segoe UI',sans-serif" font-weight="600" font-size="10" fill="#5f6b7c" text-anchor="end">Q4 2025</text>
</svg>